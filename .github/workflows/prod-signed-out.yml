name: production signed-out check
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  prod-signed-out:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: No publik key on this machine; each public build against production
        run: bash prod-signed-out.sh apps.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-prod-signed-out
          path: results
          retention-days: 3
