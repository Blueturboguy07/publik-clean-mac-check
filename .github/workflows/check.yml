name: clean Mac check
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Listing slugs, comma-separated (empty = every file)"
        required: false
        default: ""
      skip_windows:
        description: "Skip the Windows jobs"
        type: boolean
        required: false
        default: false
      skip_mac:
        description: "Run only the Windows and Linux jobs"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    if: ${{ !inputs.skip_mac }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Block publikhq.com, so a test can not touch production
        run: |
          echo "127.0.0.1 publikhq.com www.publikhq.com" | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
      - name: Gatekeeper is on (negative control)
        run: bash control.sh
      - name: Download, install and open every file
        run: bash check.sh apps.json ${{ matrix.arch }} "${{ inputs.only }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.arch }}
          path: results

  windows:
    if: ${{ !inputs.skip_windows }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, runner: windows-x64 }
          - { os: windows-11-arm, runner: windows-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Block publikhq.com, so a test can not touch production
        shell: pwsh
        run: |
          Add-Content C:\Windows\System32\drivers\etc\hosts "127.0.0.1 publikhq.com"
          Add-Content C:\Windows\System32\drivers\etc\hosts "127.0.0.1 www.publikhq.com"
          ipconfig /flushdns | Out-Null
      - name: Download, install and open every file
        shell: pwsh
        run: ./check-windows.ps1 -List apps-winlin.json -Runner ${{ matrix.runner }} -Only "${{ inputs.only }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.runner }}
          path: results

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, runner: linux-x64 }
          - { os: ubuntu-24.04-arm, runner: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Block publikhq.com, so a test can not touch production
        run: |
          echo "127.0.0.1 publikhq.com www.publikhq.com" | sudo tee -a /etc/hosts
      - name: Install what an AppImage needs on a desktop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb rpm desktop-file-utils libnss3 libasound2t64 libgbm1 libgtk-3-0t64 libatk-bridge2.0-0t64 libxss1 libfuse2t64 libegl1 libgl1 libgles2 > /dev/null
      - name: Download, run every file
        run: bash check-linux.sh apps-winlin.json ${{ matrix.runner }} "${{ inputs.only }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.runner }}
          path: results
