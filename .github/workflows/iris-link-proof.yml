name: Iris account link (production)
on:
  workflow_dispatch:
    inputs:
      dmg_url:
        description: Iris dmg to test
        required: true
permissions:
  contents: read
jobs:
  iris-link:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: A test session in Iris's own Keychain item, then Iris against production
        env:
          IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
          DMG_URL: ${{ inputs.dmg_url }}
        run: bash iris-link-proof.sh "$DMG_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-iris-link
          path: results
          retention-days: 3
